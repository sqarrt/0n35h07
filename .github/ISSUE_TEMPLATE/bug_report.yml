name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please fill in the details below. Reports in English or Russian are both fine.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
      placeholder: When I ... I expected ... but instead ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Versus bot (local)
        - Online — With friend
        - Online — Matchmaking
        - Radio
        - Other / not sure
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Game version (the chip in the menu corner), OS, display resolution / Windows scale, and how you launched it (Steam or the exe).
      placeholder: v2.0.0 / Windows 11 / 3840x2160 at 150% / Steam
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Session log / screenshots (optional)
      description: Click the version chip in the menu corner to open the log folder and attach the session's oneshot-*.log, or add screenshots / a clip.
